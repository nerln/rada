[project]
name = "rada"
version = "0.1.0"
description = "An admission queue so memory-heavy agent jobs do not all run at once."
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
authors = [{name = "Eugenio Nerelli"}]

# No runtime dependencies, on purpose. Every dependency is a maintainer who can
# push code onto this machine; the standard library is enough for this job.
dependencies = []

[project.scripts]
rada = "rada.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rada"]
